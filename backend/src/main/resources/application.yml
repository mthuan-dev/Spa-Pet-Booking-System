server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pet-spa-booking
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/spathucung?useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # update: chưa có -> Tạo mới, có rồi -> Cập nhật bảng
      # create: xoá và tạo lại mỗi lần chạy
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      # Ban đầu mode: always, Có dữ liệu rồi thì đổi lại mode: never.
      mode: never
      encoding: UTF-8
      data-locations: classpath:/data.sql

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  signerKey: "d26e1310e24cd6c2deb823d1bf798003ec7422cd7eefbdc0644b4d58ba48d7dd"
# Configure spring.security.oauth2.client.registration.google.client-id and
# client-secret from GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET when Google login is implemented.
# Do not define an incomplete OAuth registration: Spring validates the client id at startup.
# VNPay configuration will be added when payment integration is implemented.
# Supply secrets through environment variables; never commit them.
