server:
  port: ${SERVER_PORT:8080}

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}

booking:
  redis-holds-enabled: ${BOOKING_REDIS_HOLDS_ENABLED:false}

spring:
  config:
    import: optional:file:./.env[.properties]

  graphql:
    http:
      path: /api/graphql

  application:
    name: pet-spa-booking
  data:
    redis:
      url: ${BOOKING_REDIS_URL:redis://localhost:6379}
      connect-timeout: 2s
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/spathucung?useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # update: chưa có -> Tạo mới, có rồi -> Cập nhật bảng
      # create: xoá và tạo lại mỗi lần chạy
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  sql:
    init:
      # Ban đầu mode: always, Có dữ liệu rồi thì đổi lại mode: never.
      mode: never
      encoding: UTF-8
      data-locations: classpath:/data.sql

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  signerKey: "d26e1310e24cd6c2deb823d1bf798003ec7422cd7eefbdc0644b4d58ba48d7dd"

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay/return}
  query-url: ${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  server-ip: ${VNPAY_SERVER_IP:127.0.0.1}
# Configure spring.security.oauth2.client.registration.google.client-id and
# client-secret from GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET when Google login is implemented.
# Do not define an incomplete OAuth registration: Spring validates the client id at startup.
# VNPay configuration will be added when payment integration is implemented.
# Supply secrets through environment variables; never commit them.
